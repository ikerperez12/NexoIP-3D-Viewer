version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        exclude-patterns:
          - three
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        exclude-patterns:
          - '@electron/*'
          - electron
          - electron-builder
          - vite
          - '@vitejs/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
