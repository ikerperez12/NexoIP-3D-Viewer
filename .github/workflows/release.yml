name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify protected main release source
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}

    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and exact default-branch commit
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must exactly match package version '$expectedTag'."
          }
          if ($package.version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Stable releases require a plain major.minor.patch version; '$($package.version)' is not eligible."
          }

          $encodedTag = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $releaseEndpoint = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $existingRelease = $null
          try {
            $existingRelease = Invoke-RestMethod -Uri $releaseEndpoint -Headers $headers -Method Get
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) { throw }
          }
          if ($existingRelease) {
            throw "Release tag '$env:GITHUB_REF_NAME' already has a GitHub Release and must never be reused or overwritten."
          }

          $repository = gh api repos/$env:GITHUB_REPOSITORY | ConvertFrom-Json
          $defaultBranch = [string]$repository.default_branch
          if ($defaultBranch -cne 'main') { throw "Releases require protected main; repository default branch is '$defaultBranch'." }
          $mainBranch = gh api "repos/$env:GITHUB_REPOSITORY/branches/$defaultBranch" | ConvertFrom-Json
          if (-not $mainBranch.protected) {
            throw "Default branch '$defaultBranch' must be protected before a release can access production-signing."
          }

          git fetch --no-tags origin $defaultBranch
          $tagCommit = (git rev-parse 'HEAD^{commit}').Trim()
          $mainCommit = (git rev-parse "origin/$defaultBranch^{commit}").Trim()
          if ($tagCommit -cne $mainCommit) {
            throw "Release tag commit $tagCommit is not the protected $defaultBranch tip $mainCommit."
          }
          "source_sha=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Release source verified: $tagCommit is the exact protected $defaultBranch tip." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  build:
    name: Build and verify Windows artifacts
    needs: verify-release-source
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production-signing
    outputs:
      signing_subject: ${{ steps.verify_signatures.outputs.signing_subject }}

    steps:
      - name: Check out repository without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-source.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Build installer and portable executable
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Download and verify the official Electron runtime baseline
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $electronVersion = [string]$package.devDependencies.electron
          if ($electronVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Electron runtime version '$electronVersion' must be exact SemVer."
          }
          $artifactName = "electron-v$electronVersion-win32-x64.zip"
          $releaseBase = "https://github.com/electron/electron/releases/download/v$electronVersion"
          $checksums = [System.Text.Encoding]::UTF8.GetString((Invoke-WebRequest -UseBasicParsing "$releaseBase/SHASUMS256.txt").Content)
          $checksumLine = $checksums -split "`n" | Where-Object { $_ -match "^([a-f0-9]{64})\s+\*?$([regex]::Escape($artifactName))\s*$" }
          if (@($checksumLine).Count -ne 1) { throw "Official SHA-256 entry for $artifactName was not found." }
          $expectedHash = ([regex]::Match($checksumLine.Trim(), '^[a-f0-9]{64}')).Value
          $verificationDirectory = Join-Path $env:RUNNER_TEMP ("nexoip-electron-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verificationDirectory | Out-Null
          $runtimeArchive = Join-Path $verificationDirectory $artifactName
          $referenceDirectory = Join-Path $verificationDirectory 'reference'
          Invoke-WebRequest -UseBasicParsing "$releaseBase/$artifactName" -OutFile $runtimeArchive
          $actualHash = (Get-FileHash -LiteralPath $runtimeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $expectedHash) { throw "Official Electron archive hash mismatch for $artifactName." }
          Expand-Archive -LiteralPath $runtimeArchive -DestinationPath $referenceDirectory -Force
          if (-not (Test-Path (Join-Path $referenceDirectory 'electron.exe') -PathType Leaf)) {
            throw 'The verified Electron archive did not contain electron.exe at its expected root.'
          }
          "ELECTRON_REFERENCE_DIR=$referenceDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Verified official Electron runtime archive $artifactName with SHA-256 $actualHash." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Smoke test packaged application
        run: npm run test:smoke:run

      - name: Exercise installer, uninstall, and portable artifacts
        run: npm run test:release-artifacts

      - name: Stage third-party notices
        shell: pwsh
        run: Copy-Item -LiteralPath THIRD_PARTY_NOTICES.txt -Destination release/THIRD_PARTY_NOTICES.txt

      - name: Verify NexoIP signatures and official Electron runtime PE integrity
        id: verify_signatures
        shell: pwsh
        env:
          NEXOIP_SIGNING_SUBJECT: ${{ vars.NEXOIP_SIGNING_SUBJECT }}
        run: |
          $expectedSubject = [string]$env:NEXOIP_SIGNING_SUBJECT
          if ([string]::IsNullOrWhiteSpace($expectedSubject) -or $expectedSubject -match "[\r\n]") {
            throw 'production-signing must define the NEXOIP_SIGNING_SUBJECT environment variable.'
          }

          function Test-PortableExecutable([System.IO.FileInfo]$file) {
            $stream = [System.IO.File]::Open($file.FullName, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Read)
            try {
              return $stream.ReadByte() -eq 0x4D -and $stream.ReadByte() -eq 0x5A
            } finally {
              $stream.Dispose()
            }
          }

          $releaseExecutables = @(Get-ChildItem release -File -Filter '*.exe')
          if ($releaseExecutables.Count -lt 2) { throw 'Expected installer and portable executables.' }
          $publisherOwnedExecutables = @($releaseExecutables) + @(Get-ChildItem release/win-unpacked -File -Filter 'NexoIP 3D Viewer.exe')
          if ($publisherOwnedExecutables.Count -ne 3) { throw 'Expected the installer, portable executable, and unpacked application executable.' }

          foreach ($file in $publisherOwnedExecutables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $subject = $signature.SignerCertificate.Subject
            if ($signature.Status -cne 'Valid') {
              throw "NexoIP executable $($file.FullName) must be Authenticode Valid, but is $($signature.Status)."
            }
            if ($subject -cne $expectedSubject) {
              throw "Unexpected Authenticode subject for $($file.FullName). Expected '$expectedSubject', got '$subject'."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "NexoIP executable $($file.FullName) is missing a trusted Authenticode timestamp."
            }
            "- NexoIP $($file.Name): Authenticode Valid; subject $subject; timestamp $($signature.TimeStamperCertificate.Subject)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          $runtimeDirectory = (Resolve-Path release/win-unpacked).Path
          $referenceDirectory = (Resolve-Path $env:ELECTRON_REFERENCE_DIR).Path
          $electronVersion = [string]((Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.electron)
          $runtimePortableExecutables = @(Get-ChildItem $runtimeDirectory -Recurse -File | Where-Object {
            $_.FullName -cne (Join-Path $runtimeDirectory 'NexoIP 3D Viewer.exe') -and (Test-PortableExecutable $_)
          })
          $referencePortableExecutables = @(Get-ChildItem $referenceDirectory -Recurse -File | Where-Object {
            $_.FullName -cne (Join-Path $referenceDirectory 'electron.exe') -and (Test-PortableExecutable $_)
          })
          if ($runtimePortableExecutables.Count -ne $referencePortableExecutables.Count) {
            throw "Packaged Electron runtime PE count $($runtimePortableExecutables.Count) does not match official baseline $($referencePortableExecutables.Count)."
          }

          $inventory = @()
          foreach ($runtimeFile in $runtimePortableExecutables) {
            $relativePath = $runtimeFile.FullName.Substring($runtimeDirectory.Length).TrimStart('\\')
            $referenceFile = Join-Path $referenceDirectory $relativePath
            if (-not (Test-Path -LiteralPath $referenceFile -PathType Leaf) -or -not (Test-PortableExecutable (Get-Item -LiteralPath $referenceFile))) {
              throw "Unexpected PE in packaged Electron runtime: $relativePath"
            }
            $runtimeHash = (Get-FileHash -LiteralPath $runtimeFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $referenceHash = (Get-FileHash -LiteralPath $referenceFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($runtimeHash -cne $referenceHash) {
              throw "Packaged Electron runtime PE differs from verified official Electron $electronVersion baseline: $relativePath"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $runtimeFile.FullName
            $subject = [string]$signature.SignerCertificate.Subject
            $inventory += [pscustomobject]@{
              path = $relativePath
              sha256 = $runtimeHash
              authenticodeStatus = [string]$signature.Status
              signerSubject = $subject
            }
            "- Electron runtime ${relativePath}: Authenticode $($signature.Status); subject $subject" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          $inventory | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath release/ELECTRON_RUNTIME_INVENTORY.json -Encoding utf8
          "signing_subject=$expectedSubject" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate and validate CycloneDX SBOM
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $sbom = (npm sbom --omit=dev --sbom-format cyclonedx | Out-String).TrimStart([char]0xFEFF) | ConvertFrom-Json
          $sbom.metadata.component.name = $package.name
          $sbom.metadata.component.version = $package.version
          $electronVersion = [string]$package.devDependencies.electron
          if ($electronVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Electron runtime version '$electronVersion' must be exact SemVer."
          }
          $electronPurl = "pkg:npm/electron@$electronVersion"
          $existingElectron = @($sbom.components | Where-Object { $_.name -eq 'electron' -and $_.version -eq $electronVersion })
          if ($existingElectron.Count -eq 0) {
            $sbom.components += [pscustomobject]@{
              type = 'application'
              name = 'electron'
              version = $electronVersion
              purl = $electronPurl
              properties = @([pscustomobject]@{ name = 'nexoip:runtime'; value = 'Packaged Electron runtime' })
            }
          }
          if (@($sbom.components | Where-Object { $_.name -eq 'electron' -and $_.version -eq $electronVersion }).Count -ne 1) {
            throw "CycloneDX SBOM must contain exactly one Electron $electronVersion runtime component."
          }
          $sbomPath = "release/NexoIP-3D-Viewer-$env:GITHUB_REF_NAME-sbom.cdx.json"
          $sbomJson = $sbom | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText($sbomPath, $sbomJson, [System.Text.UTF8Encoding]::new($false))
          Get-Content $sbomPath -Raw | ConvertFrom-Json | Out-Null

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object {
            $_.Extension -eq '.exe' -or $_.Name -like '*.cdx.json' -or $_.Name -eq 'THIRD_PARTY_NOTICES.txt' -or $_.Name -eq 'ELECTRON_RUNTIME_INVENTORY.json'
          } | Sort-Object Name)
          if ($assets.Count -lt 5) { throw 'Expected two executables, one SBOM, runtime inventory, and third-party notices.' }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NexoIP-3D-Viewer-${{ github.ref_name }}-windows-x64
          path: |
            release/*.exe
            release/*.cdx.json
            release/SHA256SUMS.txt
            release/THIRD_PARTY_NOTICES.txt
            release/ELECTRON_RUNTIME_INVENTORY.json
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified release bundle
    needs:
      - verify-release-source
      - build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: NexoIP-3D-Viewer-${{ github.ref_name }}-windows-x64
          path: release

      - name: Revalidate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-Content release/SHA256SUMS.txt
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $filePath = Join-Path release $Matches[2]
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) { throw "Missing release asset: $($Matches[2])" }
            $actual = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }

      - name: Attest Windows binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe

      - name: Attest SBOM for Windows binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*.exe
          sbom-path: release/*.cdx.json

      - name: Attest release SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.cdx.json

  publish:
    name: Publish verified release
    needs:
      - verify-release-source
      - build
      - attest
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: NexoIP-3D-Viewer-${{ github.ref_name }}-windows-x64
          path: release

      - name: Revalidate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-Content release/SHA256SUMS.txt
          foreach ($line in $lines) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $filePath = Join-Path release $Matches[2]
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) { throw "Missing release asset: $($Matches[2])" }
            $actual = (Get-FileHash -LiteralPath $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
          }

      - name: Atomically reserve a new immutable draft release
        id: create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          NEXOIP_SIGNING_SUBJECT: ${{ needs.build.outputs.signing_subject }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $expectedSubject = [string]$env:NEXOIP_SIGNING_SUBJECT
          if ([string]::IsNullOrWhiteSpace($expectedSubject) -or $expectedSubject -match "[\r\n]") {
            throw 'The verified signing subject is unavailable for this release.'
          }

          function Resolve-TagCommit([string]$tagName) {
            $encodedTag = [uri]::EscapeDataString($tagName)
            $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" | ConvertFrom-Json
            $object = $reference.object
            $dereferenceDepth = 0
            while ($object.type -ceq 'tag') {
              if (++$dereferenceDepth -gt 8) { throw "Tag '$tagName' has an invalid dereference chain." }
              $object = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json).object
            }
            if ($object.type -cne 'commit') { throw "Tag '$tagName' resolves to unsupported object type '$($object.type)'." }
            return [string]$object.sha
          }

          $currentTagCommit = Resolve-TagCommit $env:GITHUB_REF_NAME
          if ($currentTagCommit -cne $env:SOURCE_SHA) {
            throw "Release tag moved after source verification. Expected $env:SOURCE_SHA, got $currentTagCommit."
          }

          $payload = [ordered]@{
            tag_name = $env:GITHUB_REF_NAME
            target_commitish = $env:SOURCE_SHA
            name = "NexoIP 3D Viewer $env:GITHUB_REF_NAME"
            body = "Offline-first Windows 3D model viewer.`n`nExpected Authenticode subject: $expectedSubject`n`nDownload either the per-user installer or portable executable. NexoIP executables require a valid, timestamped Authenticode signature from that exact publisher; the bundled Electron runtime PE inventory is verified byte-for-byte against Electron's official release. Verify SHA256SUMS.txt, the attached CycloneDX SBOM, runtime inventory, and GitHub build provenance before execution."
            draft = $true
            prerelease = $false
            generate_release_notes = $true
            make_latest = 'false'
          }
          $payloadPath = Join-Path $env:RUNNER_TEMP 'nexoip-create-release.json'
          [System.IO.File]::WriteAllText($payloadPath, ($payload | ConvertTo-Json -Depth 8), [System.Text.UTF8Encoding]::new($false))
          $release = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" --input $payloadPath | ConvertFrom-Json
          if (-not $release.id -or -not $release.draft) { throw 'GitHub did not create the expected draft release.' }
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Atomically reserved draft release $($release.html_url) for immutable source $env:SOURCE_SHA." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload assets to the reserved draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          $sboms = @(Get-ChildItem release -File -Filter '*.cdx.json')
          if ($executables.Count -ne 2 -or $sboms.Count -ne 1) {
            throw "Expected exactly two executables and one SBOM; got $($executables.Count) and $($sboms.Count)."
          }
          $fixedAssets = @(
            (Get-Item -LiteralPath release/SHA256SUMS.txt).FullName
            (Get-Item -LiteralPath release/THIRD_PARTY_NOTICES.txt).FullName
            (Get-Item -LiteralPath release/ELECTRON_RUNTIME_INVENTORY.json).FullName
          )
          $assetPaths = @($executables.FullName) + @($sboms.FullName) + $fixedAssets
          gh release upload $env:GITHUB_REF_NAME @assetPaths

      - name: Verify every uploaded draft asset before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft -or $release.tag_name -cne $env:GITHUB_REF_NAME) {
            throw "Refusing to verify unexpected release $env:RELEASE_ID."
          }

          $expectedHashes = @{}
          foreach ($line in Get-Content -LiteralPath release/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            $assetName = [string]$Matches[2]
            $unsafeAssetName = (
              [string]::IsNullOrWhiteSpace($assetName) -or
              [System.IO.Path]::GetFileName($assetName) -cne $assetName -or
              $expectedHashes.ContainsKey($assetName)
            )
            if ($unsafeAssetName) {
              throw "Unsafe or duplicate checksum asset name: $assetName"
            }
            $expectedHashes[$assetName] = [string]$Matches[1]
          }
          $expectedNames = @($expectedHashes.Keys) + @('SHA256SUMS.txt')
          $uploadedAssets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?per_page=100" | ConvertFrom-Json)
          if ($uploadedAssets.Count -ne $expectedNames.Count) {
            throw "Draft release asset count $($uploadedAssets.Count) does not match expected count $($expectedNames.Count)."
          }

          $verificationDirectory = Join-Path $env:RUNNER_TEMP ("nexoip-uploaded-release-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verificationDirectory | Out-Null
          try {
            foreach ($assetName in $expectedNames) {
              $matches = @($uploadedAssets | Where-Object { [string]$_.name -ceq $assetName })
              if ($matches.Count -ne 1) { throw "Draft release must contain exactly one asset named $assetName." }
              $asset = $matches[0]
              $localPath = Join-Path release $assetName
              $localItem = Get-Item -LiteralPath $localPath
              if ([int64]$asset.size -ne [int64]$localItem.Length) {
                throw "Uploaded asset size differs from the verified bundle: $assetName"
              }
              $assetId = [int64]$asset.id
              if ($assetId -lt 1) { throw "Invalid uploaded asset identifier for $assetName." }
              $downloadPath = Join-Path $verificationDirectory $assetName
              gh api --method GET -H 'Accept: application/octet-stream' "repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId" --output $downloadPath
              $expectedHash = if ($assetName -ceq 'SHA256SUMS.txt') {
                (Get-FileHash -LiteralPath $localPath -Algorithm SHA256).Hash.ToLowerInvariant()
              } else {
                $expectedHashes[$assetName]
              }
              $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -cne $expectedHash) {
                throw "Uploaded asset hash differs from the verified bundle: $assetName"
              }
            }
          } finally {
            if (Test-Path -LiteralPath $verificationDirectory) {
              Remove-Item -LiteralPath $verificationDirectory -Recurse -Force
            }
          }

      - name: Publish the verified reserved draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          function Resolve-TagCommit([string]$tagName) {
            $encodedTag = [uri]::EscapeDataString($tagName)
            $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" | ConvertFrom-Json
            $object = $reference.object
            $dereferenceDepth = 0
            while ($object.type -ceq 'tag') {
              if (++$dereferenceDepth -gt 8) { throw "Tag '$tagName' has an invalid dereference chain." }
              $object = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json).object
            }
            if ($object.type -cne 'commit') { throw "Tag '$tagName' resolves to unsupported object type '$($object.type)'." }
            return [string]$object.sha
          }

          $currentTagCommit = Resolve-TagCommit $env:GITHUB_REF_NAME
          if ($currentTagCommit -cne $env:SOURCE_SHA) {
            throw "Release tag moved before publication. Expected $env:SOURCE_SHA, got $currentTagCommit."
          }

          $publishPayload = @{ draft = $false; make_latest = 'true' }
          $publishPayloadPath = Join-Path $env:RUNNER_TEMP 'nexoip-publish-release.json'
          [System.IO.File]::WriteAllText($publishPayloadPath, ($publishPayload | ConvertTo-Json), [System.Text.UTF8Encoding]::new($false))
          $published = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --input $publishPayloadPath | ConvertFrom-Json
          if ($published.draft -or $published.tag_name -cne $env:GITHUB_REF_NAME) {
            throw 'GitHub did not publish the reserved release as expected.'
          }
          "Published immutable release $($published.html_url)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove an unpublished draft after a failed publish attempt
        if: ${{ failure() && steps.create_release.outputs.release_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $release = gh api $endpoint | ConvertFrom-Json
          if (-not $release.draft) {
            throw "Refusing to remove release $env:RELEASE_ID because it is no longer a draft."
          }
          if ($release.tag_name -cne $env:GITHUB_REF_NAME) {
            throw "Refusing to remove draft $env:RELEASE_ID because its immutable tag does not match this run."
          }
          gh api --method DELETE $endpoint
          "Removed unpublished draft $env:RELEASE_ID after a failed publish attempt; the immutable tag may be retried after review." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
